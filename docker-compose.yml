x-demo: &demo
  build:
    context: .
    dockerfile: demo/Dockerfile
  image: durastep-demo:local
  environment: &demo-env
    DURASTEP_DB_URL: jdbc:postgresql://postgres:5432/durastep
    DURASTEP_DB_USER: durastep
    DURASTEP_DB_PASSWORD: durastep

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: durastep
      POSTGRES_USER: durastep
      POSTGRES_PASSWORD: durastep
    volumes:
      - ./demo/postgres-init.sql:/docker-entrypoint-initdb.d/demo.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durastep -d durastep"]
      interval: 2s
      timeout: 3s
      retries: 15

  engine:
    <<: *demo
    deploy:
      replicas: 3
    environment:
      <<: *demo-env
      DEMO_ROLE: engine
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  load:
    <<: *demo
    environment:
      <<: *demo-env
      DEMO_ROLE: load
      DEMO_RATE: "5"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 3s
      retries: 30

  dashboard:
    <<: *demo
    entrypoint: ["java", "-jar", "/opt/durastep/durastep-cli.jar"]
    command: ["dashboard", "--bind", "0.0.0.0"]
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8099"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/durastep.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
