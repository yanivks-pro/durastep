name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["postgres:16-alpine", "postgres:alpine"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp verify -Dpostgres.image=${{ matrix.postgres }}
      - name: Build and try the CLI image
        if: matrix.postgres == 'postgres:16-alpine'
        run: |
          docker build -t durastep-cli:ci durastep-cli
          docker run --rm durastep-cli:ci --version
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ strategy.job-index }}
          path: |
            durastep-core/target/site/jacoco/
            durastep-core/target/site/jacoco-it/
          if-no-files-found: ignore

  demo:
    name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start the demo with one command
        run: docker compose up -d --build --wait
      - name: Check the dashboard and Grafana answer
        run: |
          curl -fsS http://127.0.0.1:8099/ | grep -q '<h1>Overview</h1>'
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"database": *"ok"'
      - name: Break it and check nothing was lost or done twice
        run: demo/chaos.sh --rounds 6 --gap 3
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v

  quickstart:
    name: quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Take the quickstart from the README
        run: |
          awk '/^## Quickstart/{q=1} q && /^```bash/{b=1; next} b && /^```/{exit} b' README.md > "$RUNNER_TEMP/quickstart.sh"
          test -s "$RUNNER_TEMP/quickstart.sh"
          sed -i \
            -e "s|https://github.com/yanivks-pro/durastep.git|$GITHUB_WORKSPACE|" \
            -e 's|^open \(.*\)$|curl -fsS --retry 10 --retry-connrefused \1 \| grep -q "<h1>Overview</h1>"|' \
            "$RUNNER_TEMP/quickstart.sh"
          cat "$RUNNER_TEMP/quickstart.sh"
      - name: Run it as written in an empty folder
        run: |
          mkdir "$RUNNER_TEMP/fresh"
          cd "$RUNNER_TEMP/fresh"
          bash -euo pipefail "$RUNNER_TEMP/quickstart.sh"
      - name: Break it as the README says
        run: |
          cd "$RUNNER_TEMP/fresh/durastep"
          demo/chaos.sh --rounds 3 --gap 2
      - if: failure()
        working-directory: ${{ runner.temp }}/fresh/durastep
        run: docker compose logs --tail 200
      - if: always()
        working-directory: ${{ runner.temp }}/fresh/durastep
        run: docker compose down -v
