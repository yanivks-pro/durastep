name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["postgres:16-alpine", "postgres:alpine"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -ntp verify -Dpostgres.image=${{ matrix.postgres }}
      - name: Build and try the CLI image
        if: matrix.postgres == 'postgres:16-alpine'
        run: |
          docker build -t durastep-cli:ci durastep-cli
          docker run --rm durastep-cli:ci --version
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ strategy.job-index }}
          path: |
            durastep-core/target/site/jacoco/
            durastep-core/target/site/jacoco-it/
          if-no-files-found: ignore
