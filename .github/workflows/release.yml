name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n 's:^  <version>\(.*\)</version>$:\1:p' pom.xml | head -1)
          if [ -z "$version" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version '$version'"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: ./mvnw -B -ntp verify
      - name: Take the release notes from the changelog
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Durastep $VERSION" \
            --notes-file release-notes.md \
            "durastep-core/target/durastep-core-$VERSION.jar" \
            "durastep-testkit/target/durastep-testkit-$VERSION.jar" \
            "durastep-micrometer/target/durastep-micrometer-$VERSION.jar" \
            "durastep-dashboard/target/durastep-dashboard-$VERSION.jar" \
            "durastep-opentelemetry/target/durastep-opentelemetry-$VERSION.jar" \
            "durastep-spring-boot-starter/target/durastep-spring-boot-starter-$VERSION.jar" \
            "durastep-cli/target/durastep-cli-$VERSION.jar"
