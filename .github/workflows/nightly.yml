name: Nightly chaos

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      workflows:
        description: Number of workflows
        default: "1000"
      kills:
        description: Number of kill -9 events
        default: "100"

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run the chaos test
        env:
          WORKFLOWS: ${{ inputs.workflows || '1000' }}
          KILLS: ${{ inputs.kills || '100' }}
        run: |
          case "$WORKFLOWS$KILLS" in
            *[!0-9]*) echo "::error::workflows and kills must be whole numbers"; exit 1 ;;
          esac
          ./mvnw -B -ntp verify -Pchaos \
            -Dtest=NoUnitTests -Dsurefire.failIfNoSpecifiedTests=false \
            -Dpostgres.image=postgres:16-alpine \
            -Dchaos.workflows="$WORKFLOWS" -Dchaos.kills="$KILLS"
      - name: Replay properties with thousands of random cases
        run: |
          ./mvnw -B -ntp test -pl durastep-core -am -Dtest=ReplayProperties \
            -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true -Djqwik.tries.default=5000
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chaos-report
          path: durastep-core/target/chaos/
          if-no-files-found: ignore
